<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchoolCore — Multi-School Institutional Management Platform</title>
    <meta name="description" content="Multi-school institutional management platform providing tenant isolation, digital academic administration, attendance, report cards, fee reconciliation, and parent portals." />
    <meta property="og:title" content="SchoolCore — Multi-School Institutional Management Platform" />
    <meta property="og:description" content="Multi-school institutional management platform providing tenant isolation, digital academic administration, attendance, report cards, fee reconciliation, and parent portals." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#059669" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SchoolCore" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('[SchoolCore PWA] Service Worker registered with scope:', reg.scope),
            (err) => console.warn('[SchoolCore PWA] Service Worker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
